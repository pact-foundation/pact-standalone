name: Release

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - release-triggered
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
      with:
        ruby-version: 3.4.11

    - name: Set up environment
      run: |
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global push.default current
        bundler -v
        bundle install

    - name: Prepare release
      id: prepare
      run: script/prepare-release-in-github-workflow.sh
      env:
        INCREMENT: ${{ github.event.client_payload.increment }}

    - name: Create release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        name: pact-${{ steps.prepare.outputs.version }}
        tag: ${{ steps.prepare.outputs.tag }}
        artifacts: pkg/*
        bodyFile: build/RELEASE_NOTES.md
        token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      increment: ${{ steps.prepare.outputs.increment }}

  notify-released:
    needs: release
    strategy:
      matrix:
        repository: [pact-foundation/homebrew-tap]
    runs-on: ubuntu-latest
    steps:
      - name: Notify ${{ matrix.repository }} of gem release
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.GHTOKENFORRELEASEDISPATCH }}
          repository: ${{ matrix.repository }}
          event-type: pact-standalone-released
          client-payload: |
              {
                "version": "${{ needs.release.outputs.version }}",
                "increment": "${{ needs.release.outputs.increment }}",
                "type": "pact-standalone-released"
              }
